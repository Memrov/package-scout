name: Build deps.dev dependents snapshot

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the snapshot as a draft GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deps-dev-dependents-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Test the snapshot builder
        run: |
          npm ci --ignore-scripts
          npm run check
          node --test scripts/refresh-dependents.test.ts
      # Searches npm for each term in catalog/dependents-seeds.json, then sums deps.dev direct
      # dependents for the popular results. Search is paced and backs off when npm asks.
      - name: Count direct dependents through public APIs
        run: npm run dependents:refresh
      # A draft for review: copy dependents.json over catalog/dependents.json in a pull request
      # and run npm run plugin:build, so the plugin and npm server ship the new counts.
      - name: Publish the snapshot as a draft release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="dependents-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" build/dependents/dependents.json build/dependents/dependents-manifest.json \
            --draft --target "$GITHUB_SHA" --title "Dependents ${tag}" \
            --notes 'Direct dependents from deps.dev v3alpha, summed over recent release lines. Counts and checksums are in dependents-manifest.json. Adoption evidence only; package functionality has not been certified.'
