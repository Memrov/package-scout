version: 2
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/challenges/csv'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-development:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
